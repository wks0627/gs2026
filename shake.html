<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>열매둥이 흔들기</title>
<meta name="description" content="10초 동안 나무를 연타해서 열매둥이를 수확하는 미니게임. 난이도 1~5.">
<meta name="theme-color" content="#FFF6EC">
<link rel="icon" href="images/mole-b.png">
<meta property="og:title" content="열매둥이 흔들기">
<meta property="og:description" content="10초 동안 연타해서 열매둥이를 수확해보세요! 난이도 1~5">
<style>
  :root{
    color-scheme:light;
    --red:#F8463F;
    --green:#1A9E6B;
    --leaf:#2FB97F;
    --leaf2:#179A64;
    --bark:#A9703F;
    --bark2:#8A5A32;
    --ink:#1B1B1B;
    --cream:#FFF6EC;
    --sky:#EAF7F0;
    --shadow:0 6px 0 rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    background:var(--cream);color:var(--ink);
    overflow:hidden;-webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  img{max-width:100%;-webkit-user-drag:none;}

  #app{
    max-width:560px;margin:0 auto;height:100%;
    display:flex;flex-direction:column;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));
  }
  .screen{display:none;flex:1;flex-direction:column;min-height:0;}
  .screen.on{display:flex;}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;min-height:76px;
    font-family:inherit;font-size:28px;font-weight:900;letter-spacing:-.5px;
    border:4px solid var(--ink);border-radius:22px;
    background:var(--red);color:#fff;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.22);}
  .btn.green{background:var(--green);}
  .btn.white{background:#fff;color:var(--ink);}
  .btn:focus-visible{outline:4px solid var(--ink);outline-offset:3px;}

  h1{font-size:40px;font-weight:900;text-align:center;margin:4px 0 0;letter-spacing:-1.5px;line-height:1.15;}
  h1 span{color:var(--red);}
  .sub{text-align:center;font-size:19px;font-weight:700;color:#6B6B6B;margin:8px 0 0;}

  /* 1) 닉네임 */
  #intro{justify-content:center;gap:16px;text-align:center;}
  .mascot{width:170px;height:auto;display:block;margin:0 auto;}
  .mascot.sway{animation:sway 2.6s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .field{width:100%;}
  label{display:block;font-size:22px;font-weight:900;margin:0 0 8px 4px;text-align:left;}
  input[type=text]{
    width:100%;height:76px;font-size:27px;font-weight:800;font-family:inherit;text-align:center;
    border:4px solid var(--ink);border-radius:22px;background:#fff;color:var(--ink);
    box-shadow:var(--shadow);outline:none;
  }
  input[type=text]:focus{border-color:var(--red);}

  /* 2) 난이도 */
  #setup{gap:14px;}
  .lv-list{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center;}
  .lv{
    display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:82px;
    border:4px solid var(--ink);border-radius:22px;background:#fff;
    box-shadow:var(--shadow);cursor:pointer;font-family:inherit;color:inherit;
    text-align:left;width:100%;
  }
  .lv.sel{background:var(--green);color:#fff;}
  .lv .num{
    flex:0 0 auto;width:52px;height:52px;border-radius:50%;
    border:4px solid var(--ink);background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;
  }
  .lv.sel .num{background:#fff;color:var(--red);}
  .lv .tx{min-width:0;}
  .lv .tx b{display:block;font-size:25px;font-weight:900;letter-spacing:-.5px;}
  .lv .tx small{font-size:17px;font-weight:700;opacity:.78;}

  /* 3) 게임 */
  #game{gap:10px;}
  .hud{display:flex;gap:8px;}
  .pill{
    flex:1;border:4px solid var(--ink);border-radius:20px;background:#fff;
    box-shadow:var(--shadow);padding:6px 4px;text-align:center;min-width:0;
  }
  .pill small{display:block;font-size:15px;font-weight:800;color:#777;}
  .pill b{display:block;font-size:32px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;}
  .pill.time b{color:var(--red);}
  .pill.goal b{color:var(--green);}
  .pill.time.warn{animation:blink .5s steps(2,start) infinite;}
  @keyframes blink{50%{background:#FFD9D6}}

  /* 흔들림 게이지 */
  .power{position:relative;height:26px;border:4px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden;}
  .power i{display:block;height:100%;width:0%;background:var(--leaf);transition:width .05s linear;}
  .power i.hot{background:var(--red);}
  .power span{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:900;color:var(--ink);
  }

  /* 나무 영역 = 탭 영역 */
  #tap{
    flex:1;position:relative;min-height:0;overflow:hidden;
    border:4px solid var(--ink);border-radius:22px;
    background:var(--sky);cursor:pointer;padding:0;width:100%;
    display:block;
  }
  #tree{
    position:absolute;inset:0;
    transform-origin:50% 100%;
    will-change:transform;
  }
  #tree svg{position:absolute;inset:0;width:100%;height:100%;}
  .fruit{
    position:absolute;width:19%;height:auto;
    transform:translate(-50%,-50%);
    will-change:transform,opacity;
  }
  .fruit.fall{animation:fall .62s cubic-bezier(.45,.05,.75,.6) forwards;}
  @keyframes fall{
    0%{transform:translate(-50%,-50%) rotate(0deg);opacity:1}
    100%{transform:translate(-50%,420%) rotate(260deg);opacity:0}
  }
  .basket{
    position:absolute;left:50%;bottom:2%;width:40%;
    transform:translateX(-50%);transform-origin:50% 100%;
  }
  .basket.bump{animation:bump .25s ease-out;}
  @keyframes bump{50%{transform:translateX(-50%) scaleY(.82) scaleX(1.08)}}
  .ground{position:absolute;left:0;right:0;bottom:0;height:12%;background:#C98B5E;border-top:4px solid var(--ink);}
  .hint{
    position:absolute;left:50%;bottom:30%;transform:translateX(-50%);
    padding:8px 18px;border-radius:999px;
    background:rgba(255,255,255,.92);border:3px solid var(--ink);
    font-size:20px;font-weight:900;color:var(--ink);
    white-space:nowrap;pointer-events:none;
    animation:hintPulse 1.1s ease-in-out infinite;
  }
  @keyframes hintPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
  .hint.hide{display:none;}
  .plus{
    position:absolute;font-size:28px;font-weight:900;color:var(--red);
    pointer-events:none;animation:plus .6s ease-out forwards;
  }
  @keyframes plus{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-50px)}}

  /* 카운트다운 */
  #count{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(255,246,236,.95);}
  #count.on{display:flex;}
  #count b{font-size:150px;font-weight:900;color:var(--red);animation:popin .8s ease-out;}
  @keyframes popin{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}

  /* 4) 결과 */
  #result{justify-content:center;text-align:center;gap:14px;}
  .msg{
    border:4px solid var(--ink);border-radius:24px;background:#fff;box-shadow:var(--shadow);
    padding:18px 16px;font-size:24px;font-weight:900;line-height:1.5;letter-spacing:-.5px;
  }
  .msg em{font-style:normal;color:var(--red);}
  .score{font-size:22px;font-weight:800;color:#555;}
  .score b{font-size:46px;color:var(--ink);display:block;line-height:1.2;}
  .row{display:flex;gap:10px;}
  .row .btn{font-size:23px;min-height:72px;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;}
  }
  @media (max-height:700px){
    h1{font-size:32px}
    .mascot{width:124px}
    .btn{min-height:64px;font-size:24px}
    input[type=text]{height:64px;font-size:23px}
    .lv{min-height:68px}
    .lv .tx b{font-size:22px}
    .lv .tx small{font-size:15px}
    .lv .num{width:46px;height:46px;font-size:23px}
    #count b{font-size:110px}
    .msg{font-size:21px}
  }
</style>
</head>
<body>
<div id="app">

  <!-- 1. 닉네임 -->
  <section id="intro" class="screen on">
    <img class="mascot sway" id="introFace" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="열매둥이 캐릭터">
    <h1>열매둥이 <span>흔들기</span></h1>
    <p class="sub">10초 동안 나무를 연타해서 열매둥이를 수확하세요</p>
    <div class="field">
      <label for="name">이름을 알려주세요</label>
      <input id="name" type="text" maxlength="8" placeholder="예) 홍길동" autocomplete="off">
    </div>
    <button class="btn" id="toSetup" type="button">다음</button>
  </section>

  <!-- 2. 난이도 -->
  <section id="setup" class="screen">
    <h1 id="hello"></h1>
    <p class="sub">난이도를 골라주세요</p>
    <div class="lv-list" id="lvList"></div>
    <button class="btn green" id="start" type="button">게임 시작!</button>
    <button class="btn white" id="backName" type="button" style="min-height:58px;font-size:21px">이름 다시 쓰기</button>
  </section>

  <!-- 3. 게임 -->
  <section id="game" class="screen">
    <div class="hud">
      <div class="pill time" id="pTime"><small>남은 시간</small><b id="tTime">10</b></div>
      <div class="pill"><small>수확량</small><b id="tHit">0</b></div>
      <div class="pill goal"><small>목표</small><b id="tGoal">0</b></div>
    </div>
    <div class="power"><i id="tPow"></i><span>흔들림</span></div>
    <button id="tap" type="button" aria-label="나무 흔들기">
      <div id="tree">
        <svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
          <g stroke="#1B1B1B" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
            <!-- 줄기 -->
            <path d="M136 360 q-4 -90 6 -150 h16 q10 60 6 150 z" fill="#A9703F"/>
            <!-- 가지 -->
            <path d="M144 250 q-34 -16 -52 -44" fill="none"/>
            <path d="M156 240 q34 -14 54 -42" fill="none"/>
            <!-- 수관 -->
            <g fill="#2FB97F">
              <ellipse cx="150" cy="118" rx="96" ry="78"/>
              <ellipse cx="78"  cy="152" rx="56" ry="46"/>
              <ellipse cx="222" cy="152" rx="56" ry="46"/>
              <ellipse cx="150" cy="62"  rx="62" ry="46"/>
            </g>
          </g>
        </svg>
      </div>
      <div class="ground"></div>
      <svg class="basket" viewBox="0 0 200 110" aria-hidden="true">
        <g stroke="#1B1B1B" stroke-width="7" stroke-linejoin="round">
          <path d="M16 24 h168 l-22 76 h-124 z" fill="#C98B5E"/>
          <path d="M8 24 h184" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="hint" id="hint">여기를 연타하세요!</div>
    </button>
  </section>

  <!-- 4. 결과 -->
  <section id="result" class="screen">
    <img class="mascot" id="resFace" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
    <h1 id="resTitle"></h1>
    <div class="score"><b id="resScore">0</b>개를 수확했어요</div>
    <div class="msg" id="resMsg"></div>
    <div class="row">
      <button class="btn white" id="again" type="button">다시 하기</button>
      <button class="btn green" id="next" type="button">난이도 선택</button>
    </div>
  </section>

</div>

<div id="count"><b></b></div>

   gain  : 한 번 누를 때 올라가는 흔들림
   decay : 1초에 식는 흔들림 (누르기를 멈추면 금방 떨어짐)
   need  : 열매 하나가 떨어지는 데 필요한 흔들림
   goal  : 10초 안에 수확해야 하는 개수 */
var LEVELS = [
  {lv:1, name:'아주 쉬움',  gain:1, decay:0.4, need:2.0, goal:10, desc:'살살 눌러도 잘 떨어져요'},
  {lv:2, name:'쉬움',       gain:1, decay:0.8, need:2.4, goal:12, desc:'조금 더 빠르게'},
  {lv:3, name:'보통',       gain:1, decay:1.2, need:2.8, goal:14, desc:'손을 쉬면 금방 식어요'},
  {lv:4, name:'어려움',     gain:1, decay:1.5, need:3.2, goal:15, desc:'쉬지 말고 연타!'},
  {lv:5, name:'아주 어려움', gain:1, decay:1.8, need:3.6, goal:16, desc:'온 힘을 다해 연타!'}
];

var WIN = [
  '풍년이에요! 오늘 하루도 가득 채워질 거예요 🧺',
  '멋진 수확! 당신의 하루에도 좋은 일이 열리길 🌳',
  '손끝에 힘이 넘치네요. 오늘 컨디션 최고예요 ☀️',
  '잘 해냈어요! 그 기분 그대로 오늘을 즐겨요 🌿',
  '당신이 흔든 만큼 돌아왔어요. 오늘도 그러길 🍀',
  '오늘의 당신, 정말 멋져요. 그걸 꼭 기억해요 🌺'
];
var LOSE = [
  '괜찮아요, 열매는 또 열려요. 한 번 더 해볼까요? 🌱',
  '아쉽지만 멋졌어요. 손목 한 번 풀고 다시! 💪',
  '조금만 더! 당신은 생각보다 훨씬 잘하고 있어요 😊',
  '천천히 해도 괜찮아요. 다시 하는 용기가 더 대단해요 🌈',
  '거의 다 왔어요! 숨 한 번 고르고 다시 가봐요 🍃'
];

/* 나무에 매달린 위치 (%) */
var SLOTS = [
  {x:26, y:22}, {x:50, y:14}, {x:74, y:22},
  {x:17, y:40}, {x:50, y:34}, {x:83, y:40}
];

var S = {name:'', lv:1, hit:0, goal:0, time:10, running:false, power:0, need:3, taps:0};
var T = {tick:null, raf:null, last:0, fruits:[]};

function $(id){ return document.getElementById(id); }
function show(id){
  var list = document.querySelectorAll('.screen');
  for(var i=0;i<list.length;i++) list[i].classList.remove('on');
  $(id).classList.add('on');
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

$('introFace').src = MOLE_B;
$('resFace').src = MOLE_B;

/* ===== 1) 닉네임 ===== */
$('toSetup').addEventListener('click', function(){
  var v = $('name').value.trim();
  if(!v){ $('name').focus(); $('name').placeholder = '이름을 입력해 주세요!'; return; }
  S.name = v;
  $('hello').innerHTML = '<span>' + v + '</span>님,<br>반가워요!';
  show('setup');
});
$('name').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('toSetup').click(); });
$('backName').addEventListener('click', function(){ show('intro'); });

/* ===== 2) 난이도 ===== */
var lvList = $('lvList');
LEVELS.forEach(function(L){
  var d = document.createElement('button');
  d.type = 'button';
  d.className = 'lv' + (L.lv === 1 ? ' sel' : '');
  d.innerHTML = '<span class="num">' + L.lv + '</span>'
              + '<span class="tx"><b>' + L.name + '</b>'
              + '<small>' + L.desc + ' · 목표 ' + L.goal + '개</small></span>';
  d.addEventListener('click', function(){
    var all = lvList.querySelectorAll('.lv');
    for(var i=0;i<all.length;i++) all[i].classList.remove('sel');
    d.classList.add('sel');
    S.lv = L.lv;
  });
  lvList.appendChild(d);
});

/* ===== 3) 나무에 열매둥이 매달기 ===== */
var tree = $('tree'), tap = $('tap');
SLOTS.forEach(function(p, i){
  var im = document.createElement('img');
  im.className = 'fruit';
  im.alt = '열매둥이';
  im.src = MOLES[i % 3];
  im.style.left = p.x + '%';
  im.style.top  = p.y + '%';
  tree.appendChild(im);
  T.fruits.push({el:im, on:true});
});

/* 열매 하나 떨어뜨리기 */
function dropOne(){
  var ready = T.fruits.filter(function(f){ return f.on; });
  if(!ready.length) return;
  var f = pick(ready);
  f.on = false;
  f.el.classList.add('fall');

  S.hit++;
  $('tHit').textContent = S.hit;

  var p = document.createElement('div');
  p.className = 'plus';
  p.textContent = '+1';
  p.style.left = f.el.style.left;
  p.style.top  = f.el.style.top;
  tap.appendChild(p);
  setTimeout(function(){ p.remove(); }, 620);

  var b = tap.querySelector('.basket');
  setTimeout(function(){
    b.classList.add('bump');
    setTimeout(function(){ b.classList.remove('bump'); }, 260);
  }, 520);

  /* 잠시 뒤 다시 열매가 열립니다 */
  setTimeout(function(){
    f.el.classList.remove('fall');
    f.el.src = pick(MOLES);
    f.on = true;
  }, 700);

  if(navigator.vibrate) navigator.vibrate(18);
}

/* 탭 = 나무 흔들기 */
function shake(){
  if(!S.running) return;
  S.taps++;
  S.power += LEVELS[S.lv-1].gain;
  $('hint').classList.add('hide');
  while(S.power >= S.need){ S.power -= S.need; dropOne(); }
}
tap.addEventListener('pointerdown', function(e){ e.preventDefault(); shake(); });
tap.addEventListener('keydown', function(e){
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); shake(); }
});

/* 흔들림 감쇠 + 나무 흔들기 애니메이션 */
function frame(now){
  if(!S.running){ T.raf = null; return; }
  var dt = Math.min(0.05, (now - T.last) / 1000);
  T.last = now;

  S.power = Math.max(0, S.power - LEVELS[S.lv-1].decay * dt);

  var ratio = Math.min(1, S.power / S.need);
  var bar = $('tPow');
  bar.style.width = (ratio * 100) + '%';
  if(ratio > 0.75) bar.classList.add('hot'); else bar.classList.remove('hot');

  var amp = ratio * 3.2;
  tree.style.transform = 'rotate(' + (Math.sin(now / 42) * amp) + 'deg)';

  T.raf = requestAnimationFrame(frame);
}

function startGame(){
  var cfg = LEVELS[S.lv - 1];
  clearInterval(T.tick);
  if(T.raf){ cancelAnimationFrame(T.raf); T.raf = null; }

  S.hit = 0; S.goal = cfg.goal; S.time = 10;
  S.power = 0; S.need = cfg.need; S.taps = 0; S.running = false;

  $('tHit').textContent = '0';
  $('tGoal').textContent = cfg.goal;
  $('tTime').textContent = '10';
  $('tPow').style.width = '0%';
  $('tPow').classList.remove('hot');
  $('pTime').classList.remove('warn');
  $('hint').classList.remove('hide');
  tree.style.transform = '';
  T.fruits.forEach(function(f){ f.el.classList.remove('fall'); f.on = true; });
  show('game');

  var c = $('count'), b = c.querySelector('b'), n = 3;
  c.classList.add('on'); b.textContent = n;
  var cd = setInterval(function(){
    n--;
    if(n > 0) b.textContent = n;
    else if(n === 0) b.textContent = '시작!';
    else { clearInterval(cd); c.classList.remove('on'); run(); return; }
    b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  }, 800);
}

function run(){
  S.running = true;
  T.last = performance.now();
  T.raf = requestAnimationFrame(frame);
  T.tick = setInterval(function(){
    S.time--;
    $('tTime').textContent = S.time;
    if(S.time <= 3) $('pTime').classList.add('warn');
    if(S.time <= 0) endGame();
  }, 1000);
}

function endGame(){
  S.running = false;
  clearInterval(T.tick);
  if(T.raf){ cancelAnimationFrame(T.raf); T.raf = null; }
  tree.style.transform = '';
  $('tPow').style.width = '0%';

  var win = S.hit >= S.goal;
  $('resFace').src = win ? MOLE_B : MOLE_A;
  $('resFace').className = 'mascot' + (win ? ' sway' : '');
  $('resTitle').innerHTML = win
    ? '<span>풍년!</span><br>' + S.name + '님 최고예요'
    : S.name + '님,<br><span>아쉬워요</span>';
  $('resScore').textContent = S.hit;
  $('resMsg').innerHTML = (win
      ? '목표 ' + S.goal + '개 달성! <em>난이도 ' + S.lv + ' 클리어</em><br>'
      : '목표까지 <em>' + (S.goal - S.hit) + '개</em> 남았어요<br>')
    + pick(win ? WIN : LOSE)
    + '<br><small style="font-weight:800;color:#777;font-size:17px">10초 동안 ' + S.taps + '번 눌렀어요</small>';
  show('result');
}

$('start').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);
$('next').addEventListener('click', function(){ show('setup'); });
</script>
</body>
</html>
